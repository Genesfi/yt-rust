[package]
name = "yt-rust"
version = "0.1.0"
edition = "2024"
description = "Lightweight native YouTube desktop client in Rust with egui and libmpv"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts", "links", "clipboard", "persistence"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["image", "http"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "json"] }
rquickjs = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = "0.6"
sha1 = "0.10"
sha2 = "0.10"
tao = "0.37.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5"
wry = "0.57.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
raw-window-handle = "0.6"
souvlaki = "0.9.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
