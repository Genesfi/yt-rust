name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  release:
    name: Build Windows Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/yt-rust.exe dist/yt-rust.exe
          if (Test-Path README.md) { Copy-Item README.md dist/README.md }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/LICENSE }
          Compress-Archive -Path dist/* -DestinationPath yt-rust-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: yt-rust-windows-x86_64
          path: yt-rust-windows-x86_64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: yt-rust-windows-x86_64.zip
